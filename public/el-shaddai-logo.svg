<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 76" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="esWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A532B" />
      <stop offset="50%" stop-color="#B87333" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
    <linearGradient id="esGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A6B2F" />
      <stop offset="45%" stop-color="#D4A373" />
      <stop offset="70%" stop-color="#EED5A5" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
    <linearGradient id="darkTeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24140D" />
      <stop offset="100%" stop-color="#4A2616" />
    </linearGradient>
  </defs>

  <!-- Left: Architectural Woodcraft Emblem (ES Monogram & Joinery Crest) -->
  <g transform="translate(6, 6)">
    <!-- Outer Octagonal Framing (Architectural Joinery) -->
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#darkTeak)" />
    <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="url(#esGoldGrad)" stroke-width="1.5" />
    <rect x="5.5" y="5.5" width="53" height="53" rx="8.5" stroke="url(#esWoodGrad)" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Stylized Compass / Chevron Motif -->
    <path d="M32 9 L46 23 L41 23 L32 14 L23 23 L18 23 Z" fill="url(#esGoldGrad)" opacity="0.9" />
    
    <!-- Precision Dovetail / Interlocking "E" & "S" Crest -->
    <!-- 'E' Structure -->
    <path d="M22 22 H39 V26 H27 V30 H36 V34 H27 V38 H39 V42 H22 Z" fill="#FAF7F2" />
    <!-- 'S' Accent Ribbons & Joinery -->
    <path d="M26 31 C26 27 38 27 38 31 C38 34 26 34 26 40 C26 44 38 44 38 40" stroke="url(#esGoldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Bottom Craft Mark / Foundation Block -->
    <rect x="25" y="46" width="14" height="2" rx="1" fill="url(#esGoldGrad)" />
    <circle cx="32" cy="51" r="1.5" fill="#D4A373" />
  </g>

  <!-- Right: Typography -->
  <!-- Main Name: EL SHADDAI -->
  <text x="84" y="38" font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="2.5" fill="#1C110B">
    EL SHADDAI
  </text>

  <!-- Subtitle: INTERIOR WORKS -->
  <text x="86" y="55" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.2" fill="#8A532B">
    INTERIOR WORKS
  </text>

  <!-- Fine Architectural Measurement Accent -->
  <g transform="translate(86, 61)">
    <line x1="0" y1="0" x2="230" y2="0" stroke="#E8DECE" stroke-width="1" />
    <circle cx="0" cy="0" r="1.5" fill="#8A532B" />
    <circle cx="115" cy="0" r="1.5" fill="#D4A373" />
    <circle cx="230" cy="0" r="1.5" fill="#8A532B" />
  </g>
</svg>
