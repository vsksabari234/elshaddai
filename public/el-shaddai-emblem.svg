<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="embGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A6B2F" />
      <stop offset="45%" stop-color="#D4A373" />
      <stop offset="70%" stop-color="#EED5A5" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
    <linearGradient id="embDarkTeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24140D" />
      <stop offset="100%" stop-color="#3E2013" />
    </linearGradient>
    <linearGradient id="embWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A532B" />
      <stop offset="100%" stop-color="#D4A373" />
