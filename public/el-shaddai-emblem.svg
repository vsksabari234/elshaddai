  <path d="M50 54 C50 48 72 48 72 54 C72 60 50 60 50 70 C50 77 72 77 72 70" stroke="url(#embGoldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Baseline Plinth & Star -->
  <rect x="46" y="80" width="28" height="3" rx="1.5" fill="url(#embGoldGrad)" />
  <circle cx="60" cy="90" r="3" fill="#D4A373" />
  <circle cx="48" cy="90" r="1.5" fill="#C59B27" opacity="0.6" />
  <circle cx="72" cy="90" r="1.5" fill="#C59B27" opacity="0.6" />
